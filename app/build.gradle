import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.mmd.preview'
    compileSdk 34

    defaultConfig {
        applicationId "com.mmd.preview"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.4.0"
    }

    // ⚠️ 签名信息不在仓库写死(避免公开密码)。如需自定义发布签名:
    //   在 local.properties(已被 .gitignore 忽略, 不入库)里加:
    //   keystore.file=/绝对或相对路径/your.keystore
    //   keystore.storePassword=xxx
    //   keystore.keyAlias=xxx
    //   keystore.keyPassword=xxx
    //   不配置则 debug 用 Android 默认 debug 签名构建(人人可直接 assembleDebug)。
    def keystoreProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localPropsFile.withInputStream { keystoreProps.load(it) }
    }
    def hasKeystore = keystoreProps['keystore.storePassword'] &&
            keystoreProps['keystore.keyAlias'] &&
            keystoreProps['keystore.keyPassword'] &&
            keystoreProps['keystore.file']

    signingConfigs {
        stable {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProps['keystore.file'])
                storePassword keystoreProps['keystore.storePassword']
                keyAlias keystoreProps['keystore.keyAlias']
                keyPassword keystoreProps['keystore.keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            // 未提供自定义签名时, 不指定 signingConfig → 用 Android 默认 debug 签名
            if (hasKeystore) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasKeystore) {
                signingConfig signingConfigs.stable
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    // WebViewAssetLoader 用这个库提供的虚拟域名服务 assets
    implementation 'androidx.webkit:webkit:1.9.0'
}
